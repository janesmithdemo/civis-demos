version: '2.0'

# Chains the 4 survey_demo scripts once each has been published as a Civis
# script template (backing script -> template -> this workflow references
# the template by ID). Replace the from_template_id placeholders below
# after publishing scripts/01-04 as templates (Code > Publish as Template).
#
# pull_acs_benchmarks and draw_sample run in parallel (independent inputs);
# simulate_responses depends on draw_sample; weight_and_report depends on
# both simulate_responses (for responses) and pull_acs_benchmarks (for ACS
# targets), so it joins both branches.
survey_demo_pipeline:
  type: direct
  input:
    - survey_id
    - output_schema
    - state
    - voterfile_schema
    - voterfile_table
    - sample_size
    - base_response_rate
    - random_seed: null
  tasks:
    pull_acs_benchmarks:
      action: civis.scripts.custom
      input:
        from_template_id: 318569
        arguments:
          SURVEY_ID: <% $.survey_id %>
          OUTPUT_SCHEMA: <% $.output_schema %>
          STATE: <% $.state %>
      on-success:
        - weight_and_report

    draw_sample:
      action: civis.scripts.custom
      input:
        from_template_id: 318570
        arguments:
          SURVEY_ID: <% $.survey_id %>
          OUTPUT_SCHEMA: <% $.output_schema %>
          VOTERFILE_SCHEMA: <% $.voterfile_schema %>
          VOTERFILE_TABLE: <% $.voterfile_table %>
          SAMPLE_SIZE: <% $.sample_size %>
          RANDOM_SEED: <% $.random_seed %>
      on-success:
        - conduct_survey

    conduct_survey:
      action: civis.scripts.custom
      input:
        from_template_id: 318571
        arguments:
          SURVEY_ID: <% $.survey_id %>
          OUTPUT_SCHEMA: <% $.output_schema %>
          BASE_RESPONSE_RATE: <% $.base_response_rate %>
          RANDOM_SEED: <% $.random_seed %>
      on-success:
        - weight_and_report

    weight_and_report:
      join: all
      action: civis.scripts.custom
      input:
        from_template_id: 318572
        arguments:
          SURVEY_ID: <% $.survey_id %>
          OUTPUT_SCHEMA: <% $.output_schema %>
