[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-demo"
version = "0.1.0"
description = "Demo survey sampling/weighting pipeline for Civis Platform infrastructure enablement"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "requests>=2.28",
    "ipfn>=1.4",
    "civis>=2.0",
]

[tool.setuptools.packages.find]
include = ["survey_demo*"]
