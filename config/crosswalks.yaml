# Recodes raw ACS variables (see acs_variables.yaml) into the voterfile's
# category labels (see strata.yaml), so ACS marginals and voterfile strata
# can be joined for raking in weighting.py.
#
# survey_demo.strata.validate_crosswalk_coverage() checks that every voterfile
# category used as a raking dimension has a corresponding entry here, and
# that every ACS variable listed in acs_variables.yaml is assigned to exactly
# one bucket (no double-counted or dropped population mass).

age_bucket_by_gender:
  Male:
    "18-34": [B01001_007E, B01001_008E, B01001_009E, B01001_010E, B01001_011E, B01001_012E]
    "35-49": [B01001_013E, B01001_014E, B01001_015E]
    "50-64": [B01001_016E, B01001_017E, B01001_018E, B01001_019E]
    "65+": [B01001_020E, B01001_021E, B01001_022E, B01001_023E, B01001_024E, B01001_025E]
  Female:
    "18-34": [B01001_031E, B01001_032E, B01001_033E, B01001_034E, B01001_035E, B01001_036E]
    "35-49": [B01001_037E, B01001_038E, B01001_039E]
    "50-64": [B01001_040E, B01001_041E, B01001_042E, B01001_043E]
    "65+": [B01001_044E, B01001_045E, B01001_046E, B01001_047E, B01001_048E, B01001_049E]

race5way:
  White: [B03002_003E]
  AfAm: [B03002_004E]
  Hispanic: [B03002_012E]
  Asian: [B03002_006E]
  # Catch-all: American Indian/Alaska Native, Native Hawaiian/Pacific
  # Islander, some other race, and two-or-more-races, all non-Hispanic.
  Native: [B03002_005E, B03002_007E, B03002_008E, B03002_009E]
